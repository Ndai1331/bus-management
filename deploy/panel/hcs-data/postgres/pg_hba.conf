# Host bind + UFW restrict who can reach 5432.
# Docker published ports SNAT the client IP, so pg_hba cannot reliably
# match 10.17.227.58/32. Require SCRAM for every TCP login.
local   all             all                                     peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
